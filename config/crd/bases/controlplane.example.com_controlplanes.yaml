                      type: string
                    lastSyncTime:
                      type: string
                      format: date-time
                    lag:
                      type: integer
                    healthyNodes:
                      type: array
                      items:
                        type: string
                observedGeneration:
                  type: integer
                lastReconcileTime:
                  type: string
                  format: date-time
